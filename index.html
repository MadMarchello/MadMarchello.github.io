<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТЕХНИЧЕСКИЕ РАБОТЫ </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated Grid Background -->
    <div class="grid-overlay"></div>
    
    <!-- Scan Lines Effect -->
    <div class="scanlines"></div>
    

    <!-- Animus-style Loading Lines -->
    <div class="animus-lines">
        <div class="line line-1"></div>
        <div class="line line-2"></div>
        <div class="line line-3"></div>
    </div>
    
    <!-- Particle Effects -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container maintenance-container">
        <!-- System Status Header -->
        <div class="system-status">
            <div class="status-badge status-maintenance">
                <span class="status-indicator"></span>
                <span class="status-text">MadMarchello Blog </span>
            </div>
        </div>

        <!-- Main Content -->
        <section class="maintenance-hero">
            <div class="maintenance-icon">
                <div class="icon-wrapper">
                    <div class="gear gear-1">⚙</div>
                    <div class="gear gear-2">⚙</div>
                </div>
            </div>
            
            <h1 class="maintenance-title glitch" data-text="ТЕХНИЧЕСКИЕ РАБОТЫ">
                ТЕХНИЧЕСКИЕ РАБОТЫ
            </h1>
            
            <p class="maintenance-subtitle">
                СИСТЕМА ВРЕМЕННО НЕДОСТУПНА
            </p>
            
        </section>

        <!-- Progress Section -->

        <!-- Footer -->
        <footer class="maintenance-footer">
            <div class="footer-content">
                <div class="footer-line"></div>
                <p class="footer-text">
                    <span class="footer-label">СПАСИБО ЗА ПОНИМАНИЕ</span>
                </p>
                <div class="footer-line"></div>
            </div>
            <p class="footer-copyright">
                Блог будет доступен сразу после завершения работ
            </p>
        </footer>
    </div>

</body>
</html>
